[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aevis"
version = "0.1.0"
description = "Research prototypes for Amortized Environment-Verified Inductive Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
rl = ["torch>=2.0"]
atari = [
  "gymnasium>=1.0",
  "ale-py>=0.10",
  "opencv-python>=4.8",
  "torch>=2.0",
  "stable-baselines3>=2.4",
  "pandas>=2.0",
]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
